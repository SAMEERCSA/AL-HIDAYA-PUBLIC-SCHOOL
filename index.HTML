<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Hidaya Public School - Admission Form</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #eef4f8;
        padding: 30px 10px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .header {
        background: linear-gradient(135deg, #075e54, #0b8f7d);
        color: white;
        text-align: center;
        padding: 25px;
    }

    .header h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .header p {
        font-size: 16px;
    }

    .form {
        padding: 30px;
    }

    .section-title {
        color: #075e54;
        border-left: 5px solid #0b8f7d;
        padding-left: 10px;
        margin: 25px 0 18px;
        font-size: 20px;
    }

    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 18px;
    }

    .field {
        flex: 1;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input, select, textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #0b8f7d;
        box-shadow: 0 0 5px rgba(11,143,125,0.3);
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    .gender {
        display: flex;
        gap: 20px;
        padding-top: 10px;
    }

    .gender label {
        font-weight: normal;
    }

    .buttons {
        text-align: center;
        margin-top: 30px;
    }

    button {
        border: none;
        padding: 13px 30px;
        margin: 5px;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
    }

    .submit {
        background: #075e54;
        color: white;
    }

    .reset {
        background: #ddd;
        color: #333;
    }

    button:hover {
        opacity: 0.85;
    }

    .footer {
        text-align: center;
        background: #f3f3f3;
        padding: 15px;
        color: #555;
        font-size: 14px;
    }

    #formStatus {
        text-align: center;
        margin-top: 15px;
        font-size: 16px;
        font-weight: bold;
    }

    @media(max-width: 650px) {
        .row {
            flex-direction: column;
            gap: 15px;
        }

        .form {
            padding: 20px;
        }

        .header h1 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AL HIDAYA PUBLIC SCHOOL</h1>
        <p>ADMISSION FORM | SESSION 2026–27</p>
    </div>

    <form class="form" id="admissionForm">

        <h2 class="section-title">Student Information</h2>

        <div class="row">
            <div class="field">
                <label>Student Name *</label>
                <input type="text" id="studentName" name="studentName" required>
            </div>

            <div class="field">
                <label>Date of Birth *</label>
                <input type="date" name="dob" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Gender *</label>
                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="Male" required> Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female"> Female
                    </label>
                </div>
            </div>

            <div class="field">
                <label>Admission Class *</label>
                <select name="admissionClass" required>
                    <option value="">Select Class</option>
                    <option>Nursery</option>
                    <option>LKG</option>
                    <option>UKG</option>
                    <option>Class 1</option>
                    <option>Class 2</option>
                    <option>Class 3</option>
                    <option>Class 4</option>
                    <option>Class 5</option>
                    <option>Class 6</option>
                    <option>Class 7</option>
                    <option>Class 8</option>
                    <option>Class 9</option>
                    <option>Class 10</option>
                </select>
            </div>
        </div>

        <h2 class="section-title">Parent / Guardian Information</h2>

        <div class="row">
            <div class="field">
                <label>Father's Name *</label>
                <input type="text" name="fatherName" required>
            </div>

            <div class="field">
                <label>Mother's Name *</label>
                <input type="text" name="motherName" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Mobile Number *</label>
                <input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="10 Digit Mobile Number" required>
            </div>

            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="example@gmail.com">
            </div>
        </div>

        <h2 class="section-title">Address Information</h2>

        <div class="row">
            <div class="field">
                <label>Village / Town *</label>
                <input type="text" name="village" required>
            </div>

            <div class="field">
                <label>District *</label>
                <input type="text" name="district" value="Gonda" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>State *</label>
                <input type="text" name="state" value="Uttar Pradesh" required>
            </div>

            <div class="field">
                <label>PIN Code *</label>
                <input type="text" name="pincode" pattern="[0-9]{6}" required>
            </div>
        </div>

        <div class="field">
            <label>Full Address *</label>
            <textarea name="fullAddress" required></textarea>
        </div>

        <h2 class="section-title">Previous School Information</h2>

        <div class="row">
            <div class="field">
                <label>Previous School Name</label>
                <input type="text" name="prevSchool">
            </div>

            <div class="field">
                <label>Previous Class</label>
                <input type="text" name="prevClass">
            </div>
        </div>

        <div class="buttons">
            <button type="submit" class="submit" id="submitBtn">Submit Application</button>
            <button type="reset" class="reset">Reset Form</button>
        </div>

        <div id="formStatus"></div>

    </form>

    <div class="footer">
        © 2026 AL HIDAYA PUBLIC SCHOOL | All Rights Reserved
    </div>

</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyT8nbcDKYncU96wS6ht-xpm6pGCb1jBu-Ukmun06Ah0cZeFI2TQ0lDgjo31fYOXABqVQ/exec';
  const form = document.getElementById('admissionForm');
  const statusDiv = document.getElementById('formStatus');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();

    statusDiv.style.color = 'blue';
    statusDiv.innerHTML = 'Submitting your application... Please wait.';
    submitBtn.disabled = true;

    fetch(scriptURL, { 
      method: 'POST', 
      body: new FormData(form),
      mode: 'no-cors'
    })
    .then(response => {
      statusDiv.style.color = 'green';
      statusDiv.innerHTML = '✅ Admission Form Submitted Successfully!';
      alert("Admission Form Submitted Successfully!\n\nStudent Name: " + form.studentName.value);
      form.reset();
      submitBtn.disabled = false;
    })
    .catch(error => {
      statusDiv.style.color = 'red';
      statusDiv.innerHTML = '❌ Error submitting form. Please try again.';
      console.error('Error!', error.message);
      submitBtn.disabled = false;
    });
  });
</script>

</body>
</html>
